<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="fw-bold mb-0"><i class="fa-solid fa-calendar-check me-2"></i>Agenda de Terreno</h5>
    <button class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm" onclick="SPA.abrirModal('visita', null)">
        <i class="fa-solid fa-plus me-1"></i>Programar
    </button>
</div>
<div class="row g-2">
    {% for v in visitas %}
    <div class="col-12">
        <div class="card border-0 bg-white shadow-sm rounded-3 border-start border-4 border-primary visit-card" style="cursor:pointer;" @click="SPA.verVisita({{ v.id }})">
            <div class="card-body py-2 px-3">
                <div class="d-flex align-items-center">
                    <div class="bg-primary bg-opacity-10 rounded-2 text-center px-2 py-1 me-3" style="min-width:50px;">
                        <span class="fw-bold text-primary d-block" style="font-size:0.7rem;">{{ v.fecha.split(' ')[0] }}</span>
                        <span class="text-muted small" style="font-size:0.55rem;">{{ v.fecha.split(' ')[1] }}</span>
                    </div>
                    <div class="flex-grow-1 text-start overflow-hidden">
                        <h6 class="fw-bold mb-0 small text-dark">{{ v.cliente_nombre }}</h6>
                        <small class="text-muted">{{ v.tipo_trabajo }}</small>
                    </div>
                    <div class="ms-2">
                        <span class="badge bg-{{ 'warning text-dark' if v.estado == 'Pendiente' else 'success' }} rounded-pill">{{ v.estado }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% else %}
    <div class="text-center py-5 text-muted">
        <i class="fa-solid fa-calendar-circle-plus fa-2x mb-2 d-block"></i>
        <p>Sin visitas pendientes</p>
    </div>
    {% endfor %}
</div>
