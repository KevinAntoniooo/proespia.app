<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="fw-bold mb-0"><i class="fa-solid fa-screwdriver-wrench me-2"></i>Gestión de Fallas</h5>
</div>
<div class="table-responsive">
    <table class="table table-borderless align-middle mb-0">
        <thead class="text-muted small text-uppercase">
            <tr><th>Cliente</th><th>Descripción</th><th>Fecha</th><th>Prioridad</th></tr>
        </thead>
        <tbody>
            {% for t in tareas %}
            <tr class="bg-white rounded-3 shadow-sm mb-1">
                <td class="fw-bold small">{{ t.cliente_nombre }}</td>
                <td class="small text-muted">{{ t.descripcion[:60] }}{% if t.descripcion and t.descripcion|length > 60 %}...{% endif %}</td>
                <td class="small text-muted">{{ t.fecha }}</td>
                <td><span class="badge bg-{{ {1:'danger',2:'warning',3:'primary'}[t.prioridad] or 'secondary' }} rounded-pill">P{{ t.prioridad }}</span></td>
            </tr>
            {% else %}
            <tr><td colspan="4" class="text-center py-5 text-muted"><i class="fa-solid fa-circle-check text-success fa-2x mb-2 d-block"></i>Sin fallas pendientes</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
