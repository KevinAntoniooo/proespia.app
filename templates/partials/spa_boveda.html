<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="fw-bold mb-0"><i class="fa-solid fa-table-cells-large me-2"></i>Bóveda Apps</h5>
</div>
<div class="table-responsive">
    <table class="table table-borderless align-middle mb-0">
        <thead class="text-muted small text-uppercase">
            <tr><th>App</th><th>URL</th><th>Usuario</th></tr>
        </thead>
        <tbody>
            {% for a in apps %}
            <tr class="bg-white rounded-3 shadow-sm mb-1">
                <td class="fw-bold small">{{ a.nombre_app }}</td>
                <td class="small text-muted">{{ a.url_app or '—' }}</td>
                <td class="small">{{ a.username }}</td>
            </tr>
            {% else %}
            <tr><td colspan="3" class="text-center py-5 text-muted"><i class="fa-solid fa-vault fa-2x mb-2 d-block"></i>Sin credenciales guardadas</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
