<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Restablecer Contraseña · PRO ESPÍA</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon-icon.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { color-scheme: light; --bg:#0b1220; --bg2:#0f172a; --card:#fff; --accent:#dc2626; --accent2:#b91c1c; --text:#0f172a; --soft:#475569; --border:#e2e8f0; --input:#f8fafc; }
        * { box-sizing: border-box; margin:0; padding:0; }
        body {
            font-family: 'Fira Sans', system-ui, -apple-system, sans-serif;
            color: var(--text);
            background: radial-gradient(1000px 500px at 110% 110%, rgba(99,102,241,0.22), transparent 55%), linear-gradient(135deg, var(--bg), var(--bg2));
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
        }
        .wrap { width: 100%; max-width: 420px; }
        .card { background: var(--card); border-radius: 22px; padding: 30px 28px; box-shadow: 0 20px 50px rgba(15,23,42,0.35); }
        .brand { display:flex; flex-direction:column; align-items:center; gap: 8px; margin-bottom: 18px; }
        .logo { width:64px; height:64px; border-radius:18px; background:linear-gradient(135deg,#dc2626,#991b1b); display:grid; place-items:center; box-shadow:0 10px 24px rgba(220,38,38,0.32);}
        .logo i { color:#fff; font-size:1.6rem; }
        h1 { font-size: 1.3rem; font-weight: 800; margin-bottom: 6px; text-align: center; }
        p.sub { color: var(--soft); font-size: 0.88rem; text-align: center; margin-bottom: 18px; line-height: 1.5; }

        .who {
            background: #f1f5f9; border: 1px solid var(--border);
            padding: 10px 14px; border-radius: 12px;
            display:flex; align-items: center; gap: 10px;
            font-size: 0.85rem; color: var(--text); margin-bottom: 20px;
        }
        .who i { color: var(--accent); }

        .alert { padding: 12px 14px; border-radius: 12px; font-size: 0.85rem; margin-bottom: 16px; border: 1px solid; }
        .alert-success { background: #ecfdf5; color: #065f46; border-color: #a7f3d0; }
        .alert-warning { background: #fffbeb; color: #92400e; border-color: #fde68a; }
        .alert-danger  { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
        .alert i { margin-right: 6px; }

        .field { margin-bottom: 14px; }
        .field label { display: block; font-weight: 600; font-size: 0.78rem; color: #334155; margin-bottom: 6px; }
        .input { position: relative; }
        .input i.icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .input input { width:100%; padding: 12px 14px 12px 40px; border: 1px solid var(--border); border-radius: 12px; background: var(--input); font: inherit; font-size: 0.95rem; }
        .input input:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(220,38,38,0.12); }

        .strength { height: 5px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .strength > div { height: 100%; width: 0%; background: linear-gradient(90deg, #dc2626, #f59e0b, #16a34a); transition: width 0.25s ease; }

        .btn-primary {
            width:100%; padding: 13px 18px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer;
            box-shadow: 0 8px 20px rgba(220,38,38,0.28);
            display:inline-flex; align-items:center; justify-content:center; gap: 10px;
            transition: transform 0.25s ease;
        }
        .btn-primary:hover { transform: translateY(-1px); }
    </style>
</head>
<body>
    <main class="wrap">
        <section class="card">
            <header class="brand">
                <div class="logo"><i class="fa-solid fa-lock-open"></i></div>
                <h1>Restablecer Contraseña</h1>
                <p class="sub">Crea una nueva contraseña para tu cuenta.</p>
            </header>

            <div class="who">
                <i class="fa-solid fa-user"></i>
                <span><strong>{{ user.nombre }}</strong> · {{ user.correo or user.username }}</span>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="alert alert-{{ 'warning' if category == 'warning' else 'success' if category == 'success' else 'danger' }}">
                        <i class="fa-solid fa-circle-info"></i> {{ message }}
                    </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="field">
                    <label for="password">Nueva Contraseña</label>
                    <div class="input">
                        <i class="fa-solid fa-lock icon"></i>
                        <input id="password" name="password" type="password" required minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                    </div>
                    <div class="strength"><div id="strengthBar"></div></div>
                </div>
                <div class="field">
                    <label for="password2">Confirmar Contraseña</label>
                    <div class="input">
                        <i class="fa-solid fa-shield-halved icon"></i>
                        <input id="password2" name="password2" type="password" required minlength="6" placeholder="Repite tu contraseña" autocomplete="new-password">
                    </div>
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar nueva contraseña
                </button>
            </form>
        </section>
    </main>
    <script>
        const pwd = document.getElementById('password');
        const bar = document.getElementById('strengthBar');
        pwd.addEventListener('input', () => {
            const v = pwd.value;
            let s = 0;
            if (v.length >= 6) s += 25;
            if (v.length >= 10) s += 25;
            if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s += 25;
            if (/\d/.test(v) && /[^A-Za-z0-9]/.test(v)) s += 25;
            bar.style.width = s + '%';
        });
    </script>
</body>
</html>
