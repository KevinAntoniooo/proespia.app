{% extends "base.html" %}
{% block content %}
<div class="container-fluid px-2 px-md-4 py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-danger text-white p-3 p-md-4 border-0">
                    <h4 class="fw-bold mb-0"><i class="fa-solid fa-file-signature me-2"></i>Cierre de OT #{{ log.id }}</h4>
                    <p class="mb-0 small opacity-75">Finalización de servicio técnico</p>
                </div>

                <div class="card-body p-3 p-md-4">
                    <div class="mb-4 py-2 border-top border-bottom border-light">
                        <div class="d-flex justify-content-between align-items-center py-2">
                            <span class="fw-bold text-dark small text-uppercase info-label" style="letter-spacing: 0.5px;">Sede / Cliente</span>
                            <span class="text-secondary fw-bold info-value">{{ log.rel_cliente.nombre }}</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center py-2 border-top border-light">
                            <span class="fw-bold text-dark small text-uppercase info-label" style="letter-spacing: 0.5px;">Problema Reportado</span>
                            <span class="small text-end text-muted info-value" style="max-width: 70%;">{{ log.descripcion }}</span>
                        </div>
                    </div>

                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-dark"><i class="fa-solid fa-pen-to-square me-2"></i>Informe de Solución</label>
                            <textarea name="informe" class="form-control rounded-3 shadow-sm" rows="5" 
                                      placeholder="Describe la reparación realizada, cambios de piezas o ajustes efectuados..." required></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-dark"><i class="fa-solid fa-camera me-2"></i>Evidencia del Trabajo</label>
                            <input type="file" name="foto" class="form-control rounded-3 shadow-sm" accept="image/*" capture="environment">
                            <div class="form-text small mt-2">Sube una foto del equipo operativo o del cambio realizado.</div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg rounded-3 fw-bold shadow-sm">
                                <i class="fa-solid fa-check-double me-2"></i>Finalizar Tarea
                            </button>
                            <a href="{{ url_for('ver_todas_las_tareas', user_id=usuario.id) }}" class="btn btn-link text-muted btn-sm text-decoration-none">
                                <i class="fa-solid fa-arrow-left me-1"></i>Volver sin cambios
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .bg-danger-soft { background-color: #fee2e2; }
    .card-header.bg-danger {
        background: linear-gradient(45deg, #dc3545, #b02a37);
    }
    @media (max-width: 576px) {
        .info-label { font-size: 0.72rem; }
        .info-value { font-size: 0.88rem; }
    }
</style>
{% endblock %}
