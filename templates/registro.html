<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>Crear Cuenta · PRO ESPÍA</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon-icon.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            color-scheme: light;
            --bg-deep: #0b1220;
            --bg-mid: #0f172a;
            --bg-card: #ffffff;
            --accent: #dc2626;
            --accent-2: #b91c1c;
            --text: #0f172a;
            --text-soft: #475569;
            --border: #e2e8f0;
            --input-bg: #f8fafc;
            --shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Fira Sans', system-ui, -apple-system, sans-serif;
            color: var(--text);
            background:
                radial-gradient(1200px 600px at -10% 10%, rgba(99, 102, 241, 0.18), transparent 60%),
                radial-gradient(900px 500px at 110% 110%, rgba(220, 38, 38, 0.22), transparent 55%),
                linear-gradient(135deg, var(--bg-deep), var(--bg-mid));
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }
        .wrap { width: 100%; max-width: 440px; animation: rise 0.5s ease-out; }
        @keyframes rise { from { opacity:0; transform: translateY(20px);} to {opacity:1; transform:none;} }
        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 34px 30px 30px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #dc2626, #f59e0b, #6366f1);
        }
        .brand {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            margin-bottom: 22px;
        }
        .logo {
            width: 72px; height: 72px; border-radius: 22px;
            display: grid; place-items: center;
            background: linear-gradient(135deg, #dc2626, #991b1b);
            box-shadow: 0 12px 30px rgba(220, 38, 38, 0.35);
        }
        .logo i { color: #fff; font-size: 1.85rem; }
        .brand h2 { font-size: 1.2rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; }
        .brand p { color: var(--text-soft); font-size: 0.78rem; }

        h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
        .sub { color: var(--text-soft); font-size: 0.9rem; margin-bottom: 22px; }

        .field { margin-bottom: 14px; }
        .field label {
            display: block; font-weight: 600; font-size: 0.78rem;
            color: #334155; margin-bottom: 6px; letter-spacing: 0.2px;
        }
        .input {
            position: relative;
        }
        .input i.icon {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%);
            color: #94a3b8; font-size: 0.9rem;
            pointer-events: none;
        }
        .input input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--input-bg);
            font: inherit; font-size: 0.95rem;
            color: var(--text);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        .input input:focus {
            outline: none;
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.12);
        }
        .toggle-pass {
            position: absolute; right: 12px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: #94a3b8; cursor: pointer; padding: 6px;
        }
        .toggle-pass:hover { color: var(--accent); }

        .btn-primary {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 13px 18px;
            border: none; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff; font-weight: 700; font-size: 0.95rem;
            cursor: pointer; margin-top: 6px;
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.28);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(220, 38, 38, 0.36); }
        .btn-primary:disabled { opacity: 0.7; cursor: progress; transform: none; }

        .footer-links {
            text-align: center; margin-top: 18px;
            color: var(--text-soft); font-size: 0.85rem;
        }
        .footer-links a { color: var(--accent); font-weight: 600; text-decoration: none; }
        .footer-links a:hover { text-decoration: underline; }

        .toast {
            position: fixed; right: 16px; bottom: 16px;
            background: #0f172a; color: #fff;
            padding: 12px 16px; border-radius: 12px;
            font-size: 0.88rem; max-width: 360px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.35);
            opacity: 0; transform: translateY(10px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 9999;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: #991b1b; }
        .toast.success { background: #065f46; }

        .notice {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #9a3412;
            padding: 12px 14px; border-radius: 12px;
            font-size: 0.82rem; line-height: 1.45;
            margin-bottom: 18px;
        }
        .notice i { color: #ea580c; margin-right: 6px; }

        @media (max-width: 480px) {
            .card { padding: 28px 22px 24px; border-radius: 20px; }
            h1 { font-size: 1.25rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            .wrap { animation: none; }
            .btn-primary { transition: none; }
        }
    </style>
</head>
<body>
    <main class="wrap" role="main">
        <section class="card" aria-labelledby="reg-titulo">
            <header class="brand">
                <div class="logo" aria-hidden="true"><i class="fa-solid fa-shield-halved"></i></div>
                <h2>PRO ESPÍA</h2>
                <p>Central de Seguridad</p>
            </header>

            <h1 id="reg-titulo">Crear Cuenta</h1>
            <p class="sub">Regístrate con tu correo o usa tu cuenta de Google.</p>

            <div class="notice">
                <i class="fa-solid fa-circle-info"></i>
                Por seguridad, tu cuenta entrará en estado <strong>Pendiente</strong> hasta que la jefatura asigne tu rol y active tus permisos.
            </div>

            <form id="formRegistro" novalidate>
                <div class="field">
                    <label for="reg-nombre">Nombre Completo</label>
                    <div class="input">
                        <i class="fa-solid fa-user icon"></i>
                        <input id="reg-nombre" name="nombre" type="text" required placeholder="Ej: Juan Pérez" autocomplete="name">
                    </div>
                </div>

                <div class="field">
                    <label for="reg-correo">Correo Electrónico</label>
                    <div class="input">
                        <i class="fa-solid fa-envelope icon"></i>
                        <input id="reg-correo" name="correo" type="email" required placeholder="tunombre@empresa.cl" autocomplete="email">
                    </div>
                </div>

                <div class="field">
                    <label for="reg-pass">Contraseña</label>
                    <div class="input">
                        <i class="fa-solid fa-lock icon"></i>
                        <input id="reg-pass" name="password" type="password" required minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                        <button type="button" class="toggle-pass" data-target="reg-pass" aria-label="Mostrar u ocultar contraseña">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label for="reg-pass2">Repetir Contraseña</label>
                    <div class="input">
                        <i class="fa-solid fa-shield-halved icon"></i>
                        <input id="reg-pass2" name="password2" type="password" required minlength="6" placeholder="Confirma tu contraseña" autocomplete="new-password">
                        <button type="button" class="toggle-pass" data-target="reg-pass2" aria-label="Mostrar u ocultar contraseña">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="btnRegistrar">
                    <i class="fa-solid fa-user-plus"></i>
                    Crear mi cuenta
                </button>
            </form>

            <p class="footer-links">
                ¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a>
            </p>
        </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        const toast = document.getElementById('toast');
        function showToast(msg, type) {
            toast.textContent = msg;
            toast.className = 'toast show ' + (type || '');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => toast.classList.remove('show'), 4500);
        }

        document.querySelectorAll('.toggle-pass').forEach(btn => {
            btn.addEventListener('click', () => {
                const t = document.getElementById(btn.dataset.target);
                if (!t) return;
                t.type = t.type === 'password' ? 'text' : 'password';
                btn.querySelector('i').className = t.type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
            });
        });

        const form = document.getElementById('formRegistro');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                nombre: document.getElementById('reg-nombre').value.trim(),
                correo: document.getElementById('reg-correo').value.trim(),
                password: document.getElementById('reg-pass').value,
                password2: document.getElementById('reg-pass2').value
            };
            if (!data.nombre || !data.correo || !data.password) {
                showToast('Completa todos los campos.', 'error'); return;
            }
            if (data.password.length < 6) {
                showToast('La contraseña debe tener al menos 6 caracteres.', 'error'); return;
            }
            if (data.password !== data.password2) {
                showToast('Las contraseñas no coinciden.', 'error'); return;
            }
            const btn = document.getElementById('btnRegistrar');
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creando...';
            try {
                const r = await fetch('{{ url_for("registro") }}', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify(data)
                });
                const json = await r.json().catch(() => ({}));
                if (r.ok && json.ok) {
                    showToast('¡Cuenta creada! Redirigiendo...', 'success');
                    setTimeout(() => { window.location.href = json.redirect; }, 700);
                } else if (r.status === 429) {
                    showToast(json.msg || 'Demasiados intentos. Espera 15 minutos.', 'error');
                } else if (r.status === 409) {
                    showToast(json.msg || 'El correo ya está registrado.', 'error');
                } else {
                    showToast(json.msg || 'No se pudo crear la cuenta.', 'error');
                }
            } catch (err) {
                showToast('Error de red. Intenta nuevamente.', 'error');
            } finally {
                btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Crear mi cuenta';
            }
        });

    </script>
</body>
</html>
